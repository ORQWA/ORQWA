name: Wiki

on:
  push:
    branches: [main]
    paths: [wiki, .gitmodules, 'scripts/wiki/**', .github/workflows/wiki.yml]
  pull_request:
    paths: [wiki, .gitmodules, 'scripts/wiki/**', .github/workflows/wiki.yml, 'docs/**', README.md]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

# GitHub serializes publishers; each run reads the latest main before pushing.
concurrency:
  group: wiki-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Pull the published development image
        id: image
        env:
          TOKEN: ${{ github.token }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          hash="$(cat .devcontainer/Dockerfile scripts/build-ffmpeg.sh | sha256sum | cut -c1-16)"
          image="ghcr.io/$owner/orqwa-dev:$hash"
          echo "tag=$image" >> "$GITHUB_OUTPUT"
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull "$image" || docker build -f .devcontainer/Dockerfile -t "$image" .
      - name: Wiki checks and publication scenarios in the dev container
        env:
          IMAGE: ${{ steps.image.outputs.tag }}
        run: |
          docker run --rm -v "$PWD:/workspaces/orqwa:ro" -w /workspaces/orqwa \
            "$IMAGE" sh -c 'python3 scripts/wiki/check.py && python3 -m unittest discover -s scripts/wiki -p "test_*.py"'

  publish:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Pull the published development image
        id: image
        env:
          TOKEN: ${{ github.token }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          hash="$(cat .devcontainer/Dockerfile scripts/build-ffmpeg.sh | sha256sum | cut -c1-16)"
          image="ghcr.io/$owner/orqwa-dev:$hash"
          echo "tag=$image" >> "$GITHUB_OUTPUT"
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull "$image" || docker build -f .devcontainer/Dockerfile -t "$image" .
      - name: Publish latest main and reconcile its wiki pointer
        env:
          GH_TOKEN: ${{ secrets.WIKI_AUTOMATION_TOKEN || github.token }}
          IMAGE: ${{ steps.image.outputs.tag }}
        run: |
          docker run --rm -e GH_TOKEN -e GITHUB_REPOSITORY \
            -v "$PWD:/workspaces/orqwa:ro" -w /workspaces/orqwa \
            "$IMAGE" python3 scripts/wiki/publish.py
