[package]
name = "orqwa-video"
description = "Video decoding for ORQWA's video ride mode, built on FFmpeg"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ffmpeg-next.workspace = true
quick-xml.workspace = true
rav1d.workspace = true
thiserror.workspace = true

# rav1d's x86 assembly (assembled with nasm): the pure Rust decoder alone cannot keep up with a
# 720p video on a laptop (ADR 0010).
[target.'cfg(target_arch = "x86_64")'.dependencies]
rav1d = { workspace = true, features = ["asm"] }

# rav1d's ARM assembly (assembled by the C compiler, the NDK's on Android): without it a phone or
# tablet decodes 720p slower than it plays (#383). The dotprod, i8mm and SVE2 kernels only run
# on cores that report those extensions.
[target.'cfg(target_arch = "aarch64")'.dependencies]
rav1d = { workspace = true, features = ["asm", "asm_arm64_dotprod", "asm_arm64_i8mm", "asm_arm64_sve2"] }

[features]
# Test videos for other crates' tests.
testing = []

[lints]
workspace = true
