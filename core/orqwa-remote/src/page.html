<!doctype html>
<html lang="{{LANGUAGE}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1217">
<title>ORQWA</title>
<style>
:root {
  color-scheme: dark;
  --accent: #0a9cf5; --text: #f0f2f7; --muted: #a3adbd; --surface: rgba(255, 255, 255, 0.07);
  --warning: #fabf4d; --danger: #ed545c;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  display: flex; flex-direction: column; gap: 10px; background: #0f1217; color: var(--text);
  font: 16px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
    max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation; overscroll-behavior: none;
}
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 28px; }
.brand { display: flex; align-items: center; gap: 6px; }
.brand .mark { height: 28px; width: auto; }
.brand .wordmark { height: 15px; width: auto; }
#status { flex: 1; color: var(--muted); font-size: 15px; text-align: right; }
#status.offline { color: var(--warning); }
#status.gone { color: var(--danger); }
#gear { text-align: center; color: var(--muted); }
#gear b { color: var(--text); font-size: 56px; font-variant-numeric: tabular-nums; }
button {
  font: inherit; color: inherit; background: var(--surface); border: 0; border-radius: 14px;
  padding: 10px; touch-action: none; display: flex; align-items: center; justify-content: center;
  gap: 8px; text-align: left;
}
button.pressed { background: var(--accent); }
body.idle button { opacity: 0.45; }
/* Stays in its place, so the layout never moves, but does nothing in the ride under way. */
button.inert { opacity: 0.35; }
button svg {
  fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round;
  stroke-linejoin: round; width: 24px; height: 24px; flex: none;
}
main { flex: 1; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
#big { flex: 1; display: flex; flex-direction: column; gap: 10px; min-height: 180px; }
#big button { flex: 1; flex-direction: column; gap: 4px; font-size: 22px; text-align: center; }
#big svg { width: 64px; height: 64px; }
/* On a short screen the grid scrolls rather than run over the hint below it. */
#small {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-content: start;
  min-height: 0; overflow-y: auto;
}
#small button { min-height: 56px; font-size: 15px; justify-content: flex-start; }
#small button.alone { grid-column: 1 / -1; justify-content: center; }
#hint { color: var(--muted); font-size: 13px; text-align: center; }
/* Held for a second to end the ride: the bar fills while the finger stays. */
#finish {
  position: relative; overflow: hidden; padding: 6px 12px; font-size: 14px; flex: none;
  background: rgba(237, 84, 92, 0.16); color: #ffd9dc;
}
#finish .fill {
  position: absolute; inset: 0; background: var(--danger); transform: scaleX(0);
  transform-origin: left;
}
#finish.holding .fill { transform: scaleX(1); transition: transform 1s linear; }
#finish span:last-child { position: relative; }
/* The TV remote's pad, between rides: arrows round OK, back below. */
#pad {
  flex: 1; display: grid; gap: 10px; min-height: 0;
  grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr 1fr auto;
  grid-template-areas: ". up ." "left ok right" ". down ." "back back back";
}
#pad button { font-size: 22px; }
#pad svg { width: 48px; height: 48px; }
#pad [data-step="up"] { grid-area: up; }
#pad [data-step="left"] { grid-area: left; }
#pad [data-step="ok"] { grid-area: ok; background: rgba(10, 156, 245, 0.28); }
#pad [data-step="right"] { grid-area: right; }
#pad [data-step="down"] { grid-area: down; }
#pad [data-step="back"] { grid-area: back; min-height: 64px; font-size: 18px; }
#pad [data-step="back"] svg { width: 28px; height: 28px; }
/* Keeps the screen on (keepAwake), unseen: Chrome counts only a video that covers much of the
   screen, however transparent. */
#awake {
  position: fixed; inset: 0; width: 100%; height: 100%; opacity: 0; pointer-events: none;
  z-index: -1;
}
[hidden] { display: none !important; }
/* A short screen, e.g. a small phone or one turned sideways: the big buttons put their icon
   beside the label, so they fit in less height. */
@media (max-height: 600px) {
  #big { min-height: 140px; }
  #big button { flex-direction: row; gap: 12px; font-size: 20px; }
  #big svg { width: 40px; height: 40px; }
}
/* Side by side: the big buttons on the left, the grid on the right. */
@media (orientation: landscape) {
  main { flex-direction: row; }
  #big { min-height: 0; }
  #small { flex: 1; }
  #small button { min-height: 48px; }
}
</style>
</head>
<body class="idle">
<header>
  <div class="brand" role="img" aria-label="ORQWA">{{MARK}}{{WORDMARK}}</div>
  <span id="status"></span>
  <button id="finish" hidden><span class="fill"></span><span data-word="finish_ride"></span></button>
</header>
<div id="gear" hidden><span data-word="gear"></span> <b id="gear-number"></b> <span id="gear-count"></span></div>
<main id="controls"><div id="big"></div><div id="small"></div></main>
<div id="pad" hidden>
  <button data-step="up"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button>
  <button data-step="left"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
  <button data-step="ok" data-word="ok"></button>
  <button data-step="right"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
  <button data-step="down"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
  <button data-step="back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg><span data-word="back"></span></button>
</div>
<p id="hint" data-word="keep_awake" hidden></p>
<video id="awake" src="data:video/mp4;base64,{{KEEP_AWAKE}}" playsinline disablepictureinpicture
  disableremoteplayback aria-hidden="true" tabindex="-1"></video>
<script id="words" type="application/json">{{WORDS}}</script>
<script>
"use strict";
const words = JSON.parse(document.getElementById("words").textContent);
// A number stays with its unit, e.g. "+10 %", however a label wraps.
const word = (key) => (words[key] ?? key).replace(/ %/g, "\u00a0%");
const element = (id) => document.getElementById(id);
// The token is the first part of the path; everything else lies below it.
const base = location.pathname.endsWith("/") ? location.pathname : location.pathname + "/";
const send = (path) => fetch(base + path, { method: "POST", cache: "no-store" }).catch(() => {});
// The first buttons are the big ones; the rest stand in a grid below them.
const BIG = 2;
// A line drawing for each action, in the app's icon style.
const ICONS = {
  shift_up: '<path d="M6 15l6-6 6 6"/>',
  shift_down: '<path d="M6 9l6 6 6-6"/>',
  shift_up_two: '<path d="M6 12l6-6 6 6"/><path d="M6 18l6-6 6 6"/>',
  shift_down_two: '<path d="M6 6l6 6 6-6"/><path d="M6 12l6 6 6-6"/>',
  pause: '<path d="M8 5v14"/><path d="M16 5v14"/>',
  resume: '<path d="M7 4l12 8-12 8z"/>',
  next_camera: '<path d="M3 8h4l2-3h6l2 3h4v11H3z"/><circle cx="12" cy="13" r="3.5"/>',
  overlay: '<rect x="3" y="4" width="18" height="14" rx="2"/><rect x="12" y="9" width="7" height="7" rx="1.5"/>',
  previous_track: '<path d="M18 19 9 12l9-7v14z"/><path d="M5 5v14"/>',
  play_pause: '<path d="M4 5v14l8-7z"/><path d="M16 5v14M20 5v14"/>',
  next_track: '<path d="M6 5l9 7-9 7V5z"/><path d="M19 5v14"/>',
  difficulty_up: '<path d="M3 19l6-9 4 5 3-4 5 8z"/><path d="M18 3v5M15.5 5.5h5"/>',
  difficulty_down: '<path d="M3 19l6-9 4 5 3-4 5 8z"/><path d="M15.5 5.5h5"/>',
  intensity_up: '<path d="M11 3L4 13h6l-1 8 7-10h-6z"/><path d="M19 3v5M16.5 5.5h5"/>',
  intensity_down: '<path d="M11 3L4 13h6l-1 8 7-10h-6z"/><path d="M16.5 5.5h5"/>',
  skip_step: '<path d="M5 5l7 7-7 7"/><path d="M12 5l7 7-7 7"/>',
};

document.title = word("title");
for (const node of document.querySelectorAll("[data-word]")) node.textContent = word(node.dataset.word);
for (const node of document.querySelectorAll("[data-step]:not([data-word])")) {
  node.setAttribute("aria-label", node.dataset.step);
}

// Lights `button` up briefly, as a press feels.
function flash(button) {
  navigator.vibrate?.(15);
  button.classList.add("pressed");
  setTimeout(() => button.classList.remove("pressed"), 150);
}

// The pad steps through ORQWA's screens; an arrow held keeps stepping, as a key does.
for (const button of document.querySelectorAll("#pad button")) {
  let repeat = null;
  const stop = () => {
    clearTimeout(repeat);
    clearInterval(repeat);
  };
  button.addEventListener("pointerdown", (event) => {
    event.preventDefault();
    flash(button);
    const step = button.dataset.step;
    send("nav/" + step);
    if (["up", "down", "left", "right"].includes(step)) {
      repeat = setTimeout(() => {
        repeat = setInterval(() => send("nav/" + step), 150);
      }, 450);
    }
  });
  for (const end of ["pointerup", "pointercancel", "pointerleave"]) button.addEventListener(end, stop);
  button.addEventListener("contextmenu", (event) => event.preventDefault());
}

// Ending the ride is held for a second, so a stray touch cannot end it; a tap says so.
let hint = "";
{
  const finish = element("finish");
  let timer = null;
  let hintTimer = null;
  const release = () => {
    if (timer === null) return;
    clearTimeout(timer);
    timer = null;
    finish.classList.remove("holding");
    hint = word("hold_to_finish");
    clearTimeout(hintTimer);
    hintTimer = setTimeout(() => { hint = ""; show(); }, 2500);
    show();
  };
  finish.addEventListener("pointerdown", (event) => {
    event.preventDefault();
    finish.classList.add("holding");
    timer = setTimeout(() => {
      timer = null;
      finish.classList.remove("holding");
      navigator.vibrate?.(60);
      send("finish");
    }, 1000);
  });
  for (const end of ["pointerup", "pointercancel", "pointerleave"]) finish.addEventListener(end, release);
  finish.addEventListener("contextmenu", (event) => event.preventDefault());
}

let state = { riding: false, paused: false, gear: null, gears: null, workout: false, buttons: [] };
// "online", "offline" (ORQWA out of reach: the browser tries again) or "gone" (a new link).
let connection = "offline";
let shown = "";

// Whether `action` does anything in the ride as it is: with the bike's own gears there is
// nothing to shift, the trainer difficulty is a course's, intensity and steps a workout's.
function applies(action) {
  if (action.startsWith("shift_")) return !state.riding || state.gear !== null;
  if (action.startsWith("difficulty_")) return !state.workout;
  if (action.startsWith("intensity_") || action === "skip_step") return state.workout;
  return true;
}

function icon(action) {
  return '<svg viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[action] ?? "") + "</svg>";
}

// Builds a button per assigned slot; a press sends the slot's number when the finger lands.
function build() {
  const big = element("big");
  const small = element("small");
  big.replaceChildren();
  small.replaceChildren();
  state.buttons.forEach((action, index) => {
    if (!action) return;
    const button = document.createElement("button");
    button.dataset.action = action;
    button.innerHTML = icon(action) + "<span></span>";
    button.addEventListener("pointerdown", (event) => {
      event.preventDefault();
      flash(button);
      send("press/" + (index + 1));
    });
    button.addEventListener("contextmenu", (event) => event.preventDefault());
    if (index < BIG) {
      big.append(button);
    } else {
      // Two to a row, left and right, as the rider's dialog names them.
      button.dataset.row = Math.floor((index - BIG) / 2);
      small.append(button);
    }
  });
}

function show() {
  const status = element("status");
  status.className = connection === "online" ? "" : connection;
  status.textContent =
    connection === "gone" ? word("old_link")
    : connection === "offline" ? word("reconnecting")
    : hint && state.riding ? hint
    : !state.riding ? word("not_riding")
    : state.paused ? word("paused")
    : "";
  // Between rides the pad goes through the screens; during one the ride's buttons work it.
  element("pad").hidden = state.riding;
  element("controls").hidden = !state.riding;
  element("finish").hidden = !state.riding;
  const gears = state.gear !== null;
  element("gear").hidden = !gears || !state.riding;
  if (gears) {
    element("gear-number").textContent = state.gear;
    element("gear-count").textContent = "/ " + state.gears;
  }
  const assigned = JSON.stringify(state.buttons);
  if (assigned !== shown) {
    shown = assigned;
    build();
  }
  for (const button of document.querySelectorAll("button[data-action]")) {
    const action = button.dataset.action;
    // Held from the header instead: a tap must never end the ride.
    button.hidden = action === "finish_ride";
    button.classList.toggle("inert", !applies(action));
    const shownAs = action === "pause" && state.paused ? "resume" : action;
    button.querySelector("svg").innerHTML = ICONS[shownAs] ?? "";
    button.querySelector("span").textContent = word(shownAs);
  }
  // A button left alone in its row spans it rather than standing beside a gap; a row with
  // none left closes up.
  const small = element("small");
  for (const button of small.children) {
    const row = small.querySelectorAll(`[data-row="${button.dataset.row}"]:not([hidden])`);
    button.classList.toggle("alone", row.length === 1);
  }
  element("big").hidden = !element("big").querySelector("button:not([hidden])");
  document.body.classList.toggle("idle", connection !== "online");
}

const events = new EventSource(base + "events");
events.onmessage = (event) => {
  state = JSON.parse(event.data);
  connection = "online";
  show();
};
events.onerror = () => {
  // Closed for good when ORQWA answered, but not with the ride: the link was renewed.
  connection = events.readyState === EventSource.CLOSED ? "gone" : "offline";
  show();
};

// The screen stays on while the page shows. Over plain http, as ORQWA serves it, the browser
// has no wake lock to give, so the page plays a silent clip unseen, for which phones keep the
// screen on as for any video: Chrome for a muted one that covers the screen, Firefox for a muted
// one with a sound track, Safari only for one that may sound and does not loop, so there it
// plays its silence beside the rider's music.
// Where the clip cannot play either, the rider is told to turn the auto-lock off.
const awake = element("awake");
if (navigator.audioSession) {
  navigator.audioSession.type = "ambient";
} else {
  awake.muted = true;
}
awake.addEventListener("timeupdate", () => {
  if (awake.currentTime > awake.duration - 1) awake.currentTime = 0;
});
// Held while the page shows; the browser lets it go when the page hides.
let lock = null;
awake.addEventListener("error", () => {
  if (!lock) element("hint").hidden = false;
});
function keepAwake() {
  if (document.visibilityState !== "visible" || (lock && !lock.released)) return;
  if (!navigator.wakeLock) {
    // Safari plays sound only from a touch on the page, so until the first one this waits.
    if (awake.paused) awake.play().catch(() => {});
    return;
  }
  navigator.wakeLock.request("screen").then(
    (sentinel) => { lock = sentinel; },
    () => awake.play().catch(() => {}),
  );
}
for (const type of ["touchend", "click"]) document.addEventListener(type, keepAwake);
// ORQWA counts the phone gone once it stops hearing this, e.g. when its screen locks. The clip
// starts again too if the phone stopped it, say for a call.
setInterval(() => {
  if (document.visibilityState === "visible") {
    send("alive");
    keepAwake();
  }
}, 10000);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") {
    send("alive");
    keepAwake();
  }
});
keepAwake();
show();
</script>
</body>
</html>
